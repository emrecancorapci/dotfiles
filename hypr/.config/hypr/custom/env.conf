# You can put extra environment variables here
# https://wiki.hyprland.org/Configuring/Environment-variables/

# SSH
env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/keyring/ssh
env = SSH_ASKPASS,/usr/bin/ksshaskpass
env = SSH_ASKPASS_REQUIRE,prefer

# QT
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_STYLE_OVERRIDE, Adwaita-Dark
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
# env = QT_DEBUG_PLUGINS, 1 # If you wanna debug

# XDG
env = XDG_MENU_PREFIX ,arch-
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# GTK
env = GTK_THEME,Adwaita:dark
env = GTK2_RC_FILES,/usr/share/themes/Adwaita-dark/gtk-2.0/gtkrc

# Other
env = BROWSER, firefox
env = EDITOR, nano
env = TERMINAL, alacritty

# Firefox
env = MOZ_ENABLE_WAYLAND, 1
env = MOZ_DISABLE_RDD_SANDBOX, 1
# env = EGL_PLATFORM, wayland # Doesn't need anymore

# Wayland
env = OZONE_PLATFORM, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = GDK_BACKEND, wayland,x11,* # Tells GTK to use Wayland, fall back to X11 if needed
env = QT_QPA_PLATFORM, wayland;xcb  # Tells QT to use Wayland, fall back to X11
env = SDL_VIDEODRIVER, wayland      # Forces SDL games to run natively on Wayland
env = CLUTTER_BACKEND, wayland      # Forces Clutter apps to use Wayland

# Keyring
env = DBUS_SESSION_BUS_ADDRESS,unix:path=$XDG_RUNTIME_DIR/bus

# Gaming
env = ENABLE_GAMESCOPE_WSI, 0
env = DXVK_HDR, 1
env = ENABLE_LAYER_MESA_ANTI_LAG, 1
env = PROTON_NO_WM_DECORATION, 1
env = PROTON_ENABLE_WAYLAND, 1
env = PROTON_FSR4_UPGRADE, 1
env = PROTON_FSR4_RDNA3_UPGRADE, 1
env = PROTON_XESS_UPGRADE, 1