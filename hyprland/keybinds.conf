
# Focusing
bindm = Super, mouse:272, movewindow # Move
bindm = Super, mouse:274, movewindow 
bindm = Super, mouse:273, resizewindow # Resize
bind = Super, Left, movefocus, l 
bind = Super, Right, movefocus, r 
bind = Super, Up, movefocus, u 
bind = Super, Down, movefocus, d 
bind = Alt, F4, killactive,
bind = Super, Q, killactive,
bind = Super+Shift+Alt, Q, exec, hyprctl kill # Forcefully zap a window

# Workspace
bind = Super+Shift, mouse_down, movetoworkspace, r-1 
bind = Super+Shift, mouse_up, movetoworkspace, r+1 
bind = Super+Alt, mouse_down, movetoworkspace, -1 
bind = Super+Alt, mouse_up, movetoworkspace, +1 

# Move with keys
bind = Ctrl+Super, Right, workspace, r+1 
bind = Ctrl+Super, Left, workspace, r-1 
bind = Ctrl+Super+Alt, Right, workspace, m+1 
bind = Ctrl+Super+Alt, Left, workspace, m-1
bind = Ctrl+Super, Up, workspace, r-5
bind = Ctrl+Super, Down, workspace, r+5 

# Move with mouse
bind = Super, mouse_up, workspace, +1 
bind = Super, mouse_down, workspace, -1 
bind = Ctrl+Super, mouse_up, workspace, r+1 
bind = Ctrl+Super, mouse_down, workspace, r-1 

# Move window
bind = Super+Shift, Left, movewindow, l # [hidden]
bind = Super+Shift, Right, movewindow, r # [hidden]
bind = Super+Shift, Up, movewindow, u # [hidden]
bind = Super+Shift, Down, movewindow, d # [hidden]
bind = Ctrl+Super+Shift, Right, movetoworkspace, r+1 # [hidden]
bind = Ctrl+Super+Shift, Left, movetoworkspace, r-1 # [hidden]

# Positioning mode
bind = Super+Alt, Space, togglefloating, # Float/Tile
bind = Super, D, fullscreen, 1 # Maximize
bind = Super, F, fullscreen, 0 # Fullscreen
bind = Super+Alt, F, fullscreenstate, 0 3 # Fullscreen spoof
bind = Super, P, pin # Pin

# Media
bindl= ,XF86AudioPlay, exec, playerctl play-pause
bindl= ,XF86AudioPause, exec, playerctl play-pause
bindl= ,XF86AudioNext, exec, playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"`
bindl= ,XF86AudioPrev, exec, playerctl previous

# Screenshot
bind = Super+Shift, S, exec, grim -g "$(slurp -d)" - | wl-copy

# Apps
## Terminal
bind = Super, Return, exec, ~/.config/hypr/scripts/launch_first_available.sh  "${TERMINAL}" "foot" "alacritty" "kitty -1" "wezterm" "konsole" "kgx" "uxterm" "xterm"
bind = Super, T, exec, ~/.config/hypr/scripts/launch_first_available.sh  "${TERMINAL}" "foot" "alacritty" "kitty -1" "wezterm" "konsole" "kgx" "uxterm" "xterm"
bind = Ctrl+Alt, T, exec, ~/.config/hypr/scripts/launch_first_available.sh  "${TERMINAL}" "foot" "alacritty" "kitty -1" "wezterm" "konsole" "kgx" "uxterm" "xterm"

bind = Super, E, exec, ~/.config/hypr/scripts/launch_first_available.sh "dolphin" "nautilus" "nemo" "thunar" "${TERMINAL}" "kitty -1 fish -c yazi" # File manager
bind = Super, W, exec, ~/.config/hypr/scripts/launch_first_available.sh "google-chrome-stable" "zen-browser" "firefox" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf" # Browser
bind = Super, C, exec, ~/.config/hypr/scripts/launch_first_available.sh "code" "codium" "cursor" "zed" "zedit" "zeditor" "kate" "gnome-text-editor" "emacs" "command -v nvim && kitty -1 nvim" "command -v micro && kitty -1 micro" # Code editor
bind = Ctrl+Super, V, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "pavucontrol-qt" "pavucontrol" # Volume mixer

# bind = Super, S, togglespecialworkspace, # Toggle scratchpad